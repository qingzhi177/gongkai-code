# ⚠️ 2026-10-16 起（Phase 1）记忆库已不再使用 ChromaDB：向量存在 SQLite 的 vectors 表里（services/memory-service/vector_store.py）。
# 容器已停止并设置为不随开机启动；这个文件只保留用于回滚。确认一段时间没问题后，可以删掉容器和 data/chroma/。
services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: memory-chromadb
    ports:
      # S3 安全加固：只绑定本机回环地址。Docker 发布的端口会直接写 iptables、绕过 ufw，
      # 以前的 "8000:8000" 等于把向量库（含记忆原文）对公网开放。
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    volumes:
      # 修复：新版 Chroma 镜像的数据目录是 /data（容器内 /config.yaml 的 persist_path），
      # 以前挂载的 /chroma/chroma 实际没被使用 —— 向量只存在容器内部，重建容器就会丢失，也不在备份里。
      - ./data/chroma:/data
    environment:
      - ANONYMIZED_TELEMETRY=False
      # S3：关闭 reset 接口（以前开着，任何能连上 8000 端口的人都能清空向量库）
      - ALLOW_RESET=False
    restart: unless-stopped
